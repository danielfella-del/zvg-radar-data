name: ZVG Dossiers und Medien anreichern

on:
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector/enrich_details.py'
      - 'collector/cache_media.py'
      - 'collector/extract_report_photos.py'
      - 'collector/photo_quality.py'
      - 'tests/test_detail_parser.py'
      - '.github/workflows/enrich-zvg.yml'

permissions:
  contents: write

concurrency:
  group: zvg-data-writer
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r collector/requirements.txt

      - name: Detailparser testen
        run: python tests/test_detail_parser.py

      - name: Erste Dossiers anreichern
        run: python collector/enrich_details.py --data data/auctions.json --limit 25

      - name: Amtliche Dokumente und Portal-Medien zuerst cachen
        continue-on-error: true
        run: timeout 10m python collector/cache_media.py --data data/auctions.json --media-dir media --max-files 80 --max-run-mb 90 --max-file-mb 24

      - name: Objektfotos aus Gutachten extrahieren
        continue-on-error: true
        run: timeout 8m python collector/extract_report_photos.py --data data/auctions.json --media-dir media --max-reports 12 --max-photos 2 --max-report-mb 180 --priority-id he-55016

      - name: Gutachten automatisch analysieren
        continue-on-error: true
        run: python collector/analyze_documents.py --data data/auctions.json --repo-root . --limit 20

      - name: Dossiers und Medien speichern
        shell: bash
        run: |
          if git diff --quiet -- data/auctions.json media; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "zvg-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json media
          git commit -m "ZVG-Dossiers und Medien angereichert"
          git pull --rebase
          git push
