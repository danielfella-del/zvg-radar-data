name: ZVG Dossier Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-zvg.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten
        run: pip install -r collector/requirements.txt

      - name: Diagnoseordner
        run: mkdir -p diagnostics

      - name: Ein Dossier testen
        continue-on-error: true
        shell: bash
        run: |
          python collector/enrich_details.py --data data/auctions.json --limit 1 > diagnostics/enrich.log 2>&1
          cp data/auctions.json diagnostics/auctions-after-enrich.json

      - name: Diagnose speichern
        if: always()
        shell: bash
        run: |
          git config user.name "zvg-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics
          if git diff --cached --quiet; then
            echo "Keine Diagnoseänderung."
            exit 0
          fi
          git commit -m "ZVG-Dossier Diagnose"
          git pull --rebase
          git push
