name: ZVG Daten aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,14 * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'tests/**'
      - '.github/workflows/update-zvg.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r collector/requirements.txt

      - name: Parser testen
        run: |
          python tests/test_parser.py
          python tests/test_detail_parser.py

      - name: ZVG-Daten sammeln
        run: python collector/collect.py --output data/auctions.json

      - name: Detailseiten schrittweise anreichern
        run: python collector/enrich_details.py --data data/auctions.json --limit 250

      - name: Amtliche PDFs und Fotos begrenzt cachen
        run: python collector/cache_media.py --data data/auctions.json --media-dir media

      - name: Änderungen speichern
        shell: bash
        run: |
          if git diff --quiet -- data/auctions.json media; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "zvg-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auctions.json media
          git commit -m "ZVG-Daten und Dossiers automatisch aktualisiert"
          git push
