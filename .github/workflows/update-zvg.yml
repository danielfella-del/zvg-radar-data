name: ZVG Daten stündlich aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'tests/**'
      - '.github/workflows/update-zvg.yml'

permissions:
  contents: write

concurrency:
  group: zvg-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt

      - name: Abhängigkeiten installieren
        run: pip install -r collector/requirements.txt

      - name: Parser testen
        run: |
          python tests/test_parser.py
          python tests/test_detail_parser.py
          python tests/test_state_coverage.py
          python tests/test_official_notice_parsers.py

      - name: Alten Stand für Historie sichern
        run: cp data/auctions.json /tmp/auctions-before.json

      - name: ZVG-Daten sammeln
        run: python collector/collect.py --output data/auctions.json

      - name: Baden-Württemberg aus amtlichen Gerichtsseiten ergänzen
        continue-on-error: true
        run: timeout 3m python collector/collect_bw_official.py --output data/supplemental_bw.json

      - name: Hamburg aus Amtlichem Anzeiger ergänzen
        continue-on-error: true
        run: timeout 3m python collector/collect_hh_official.py --output data/supplemental_hh.json

      - name: Mecklenburg-Vorpommern aus Amtlichem Anzeiger ergänzen
        continue-on-error: true
        run: timeout 3m python collector/collect_mv_official.py --output data/supplemental_mv.json

      - name: Schleswig-Holstein aus amtlichen Anzeigen ergänzen
        continue-on-error: true
        run: timeout 3m python collector/collect_sh_official.py --output data/supplemental_sh.json

      - name: Zusatzquellen dedupliziert zusammenführen
        run: |
          python collector/merge_supplemental.py             --data data/auctions.json             --supplement data/supplemental_bw.json             --supplement data/supplemental_hh.json             --supplement data/supplemental_mv.json             --supplement data/supplemental_sh.json

      - name: Objekthistorie fortschreiben
        run: python collector/merge_history.py --before /tmp/auctions-before.json --data data/auctions.json

      - name: Länderabdeckung prüfen
        run: python collector/coverage_audit.py --data data/auctions.json

      - name: Detailseiten schrittweise anreichern
        run: python collector/enrich_details.py --data data/auctions.json --limit 20

      - name: Änderungen speichern
        shell: bash
        run: |
          if git diff --quiet -- data/auctions.json; then
            echo "Keine Änderungen."
          else
            git config user.name "zvg-radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/auctions.json
            git commit -m "ZVG-Daten, Historie und Dossiers stündlich aktualisiert"
            git pull --rebase
            git push
          fi

      - name: ZVGPro E-Mail-Alerts anstoßen
        continue-on-error: true
        env:
          ZVGPRO_ALERT_CRON_TOKEN: ${{ secrets.ZVGPRO_ALERT_CRON_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ZVGPRO_ALERT_CRON_TOKEN" ]; then
            echo "GitHub-Secret ZVGPRO_ALERT_CRON_TOKEN fehlt - E-Mail-Alerts werden übersprungen."
            exit 0
          fi
          curl -fsS -X POST             -H "Authorization: Bearer $ZVGPRO_ALERT_CRON_TOKEN"             https://zvgpro.de/api/alerts-run.php
