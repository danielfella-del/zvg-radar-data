name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: zvgpro-mariadb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: ZVGPro Webhook und Token prüfen
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          token = os.environ.get('ZVGPRO_DB_SYNC_TOKEN', '').strip()
          if not token:
              print('::error::GitHub Secret ZVGPRO_DB_SYNC_TOKEN fehlt.')
              raise SystemExit(1)

          req = urllib.request.Request(
              'https://zvgpro.de/api/github-sync.php',
              data=b'{"action":"ping"}',
              method='POST',
              headers={
                  'Authorization': 'Bearer ' + token,
                  'X-ZVGPro-Sync-Token': token,
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  'User-Agent': 'ZVGPro-GitHub-Sync/8.9.58',
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=25) as resp:
                  result = json.loads(resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              detail = e.read().decode('utf-8', 'replace')[:1000]
              if e.code == 401:
                  print('::error::ZVGPRO_DB_SYNC_TOKEN stimmt nicht mit dem Token auf ZVGPro überein. Auf /database/remote-sync.php ein neues Token erzeugen und das GitHub-Secret ersetzen.')
              else:
                  print(f'::error::ZVGPro Webhook antwortet mit HTTP {e.code}: {detail}')
              raise SystemExit(1)
          except Exception as e:
              print(f'::error::ZVGPro Webhook nicht erreichbar: {e}')
              raise SystemExit(1)

          if not result.get('ok'):
              print('::error::ZVGPro Webhook-Test fehlgeschlagen: ' + str(result))
              raise SystemExit(1)
          print('Webhook OK - MariaDB erreichbar, aktive Verfahren:', result.get('active'))
          PY

      - name: Aktuellen ZVG-Datensatz laden
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2             "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/data/auctions.json"             -o auctions.json
          test -s auctions.json
          echo "Datensatz: $(du -h auctions.json | cut -f1)"

      - name: MariaDB in sicheren Batches synchronisieren
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request

          endpoint = 'https://zvgpro.de/api/github-sync.php'
          token = os.environ['ZVGPRO_DB_SYNC_TOKEN'].strip()

          with open('auctions.json', 'rb') as source:
              raw = source.read()
          dataset_hash = hashlib.sha256(raw).hexdigest()
          data = json.loads(raw)
          rows = data.get('results', data) if isinstance(data, dict) else data
          if not isinstance(rows, list) or len(rows) < 500:
              raise RuntimeError(f'Ungueltiger Datenbestand: {len(rows) if isinstance(rows, list) else 0} Verfahren')
          generated_at = data.get('meta', {}).get('generated_at') if isinstance(data, dict) else None

          def encode(payload):
              return json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')

          def make_batches(rows, run_id, max_bytes=128 * 1024, max_items=75):
              # Bound the complete UTF-8 request, not just the number of objects.
              # Keep every source field and preserve ordering/absolute offsets.
              batches = []
              offset = 0
              while offset < len(rows):
                  batch = []
                  size = len(encode({'action': 'batch', 'run_id': run_id, 'offset': offset, 'objects': []}))
                  for row in rows[offset:offset + max_items]:
                      added = len(encode(row)) + (1 if batch else 0)
                      if size + added > max_bytes:
                          if not batch:
                              raise RuntimeError(f'Einzelnes Verfahren an Position {offset} überschreitet das Paketlimit von {max_bytes} Bytes. Import nicht gestartet; keine Daten gekürzt.')
                          break
                      batch.append(row)
                      size += added
                  batches.append((offset, batch))
                  offset += len(batch)
              return batches

          # Validate all objects before opening a server-side import.
          # Reserve ample digits for the actual run ID in the later envelopes.
          make_batches(rows, 99999999999999999999)

          def post(payload, attempts=3):
              body = encode(payload)
              last = None
              for attempt in range(1, attempts + 1):
                  req = urllib.request.Request(
                      endpoint,
                      data=body,
                      method='POST',
                      headers={
                          'Authorization': 'Bearer ' + token,
                          'X-ZVGPro-Sync-Token': token,
                          'Content-Type': 'application/json',
                          'Accept': 'application/json',
                          'User-Agent': 'ZVGPro-GitHub-Sync/8.9.58',
                      },
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          result = json.loads(resp.read().decode('utf-8'))
                      if not result.get('ok'):
                          raise RuntimeError(result.get('error', 'Unbekannter Serverfehler'))
                      return result
                  except urllib.error.HTTPError as e:
                      detail = e.read().decode('utf-8', 'replace')[:2000]
                      last = RuntimeError(f'HTTP {e.code}, Aktion {payload.get("action")}, Offset {payload.get("offset", "-")}, Paket {len(body)} Bytes: {detail}')
                      # Repeating an invalid/unauthorized request cannot repair it.
                      if 400 <= e.code < 500 and e.code not in (408, 429):
                          raise last
                  except Exception as e:
                      last = e
                  if attempt < attempts:
                      time.sleep(attempt * 3)
              raise last

          begin = post({'action': 'begin', 'total': len(rows), 'dataset_hash': dataset_hash, 'generated_at': generated_at})
          if begin.get('not_modified'):
              print(f'Keine Aenderung - {begin.get("count", len(rows))} Verfahren bereits aktuell.')
              raise SystemExit(0)

          run_id = int(begin['run_id'])
          batches = make_batches(rows, run_id)
          total_batches = len(batches)
          print(f'Sync-Run {run_id}: {len(rows)} Verfahren in {total_batches} Batches, maximal 128 KiB pro Paket.', flush=True)

          for n, (offset, batch) in enumerate(batches, 1):
              result = post({'action': 'batch', 'run_id': run_id, 'offset': offset, 'objects': batch})
              expected = offset + len(batch)
              if int(result.get('processed', -1)) != expected:
                  raise RuntimeError(f'Server bestätigt {result.get("processed")} statt {expected} Verfahren. Import wird nicht abgeschlossen.')
              if n == 1 or n % 10 == 0 or n == total_batches:
                  print(f'Batch {n}/{total_batches}: {result.get("processed", 0)}/{len(rows)} verarbeitet.', flush=True)

          try:
              final = post({'action': 'finalize', 'run_id': run_id}, attempts=1)
          except Exception as finalize_error:
              # A completed server import can lose its HTTP response. Check the
              # stored hash and count before treating that as a sync failure.
              try:
                  verified = post({'action': 'begin', 'total': len(rows), 'dataset_hash': dataset_hash, 'generated_at': generated_at}, attempts=2)
              except Exception:
                  raise finalize_error
              if not verified.get('not_modified') or int(verified.get('count', 0)) != len(rows):
                  raise finalize_error
              print('Abschlussantwort verloren; Datensatz in MariaDB verifiziert.')
              final = {'count': verified['count'], 'recovered': True}
          print('DB-Sync abgeschlossen:', json.dumps({
              'count': final.get('count'),
              'inserted': final.get('inserted'),
              'updated': final.get('updated'),
              'unchanged': final.get('unchanged'),
              'deactivated': final.get('deactivated'),
          }, ensure_ascii=False))
          PY

