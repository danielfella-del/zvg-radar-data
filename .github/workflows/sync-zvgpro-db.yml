name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: zvgpro-mariadb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Datensatz und Sync-Client aus demselben Commit laden
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/auctions.json
            /.github/scripts/sync-zvgpro-db.py

      - name: Unveränderlichen Snapshot für den Sync bereitstellen
        shell: bash
        run: |
          cp data/auctions.json auctions.json
          cp .github/scripts/sync-zvgpro-db.py sync-zvgpro-db.py
          test -s auctions.json
          test -s sync-zvgpro-db.py

      - name: PHP-Protokoll prüfen und MariaDB vollständig synchronisieren
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: python sync-zvgpro-db.py

