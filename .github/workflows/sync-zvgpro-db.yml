name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ZVG Daten stündlich aktualisieren
      - ZVG Dossiers und Medien anreichern
      - ZVG Dokumente gezielt nachpflegen
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

# Readers, writers, diagnostics and migration share one lock. The storage API
# additionally enforces snapshot generations for writers outside Actions.
concurrency:
  group: zvg-data-writer
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      ${{ github.repository == 'danielfella-del/zvg-radar-data' &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (
              github.event.workflow_run.event == 'schedule' ||
              github.event.workflow_run.event == 'workflow_dispatch'
            )
          )
        ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Nur Pipeline-Code laden
        uses: actions/checkout@v4
        with:
          # Resolve the reviewed main code only after the shared writer lock.
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /collector/
            /scripts/
            /tests/

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Unveränderlichen privaten Snapshot vollständig synchronisieren
        env:
          PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/zvg-private-runtime
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        run: python .github/scripts/private-pipeline.py sync

      - name: Temporäre Laufzeitdaten entfernen
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zvg-private-runtime'
          if path.is_symlink():
              path.unlink()
          elif path.exists():
              shutil.rmtree(path)
          PY
