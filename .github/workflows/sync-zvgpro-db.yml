name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  # New source snapshots must not wait for another scheduled Actions run.
  workflow_run:
    workflows:
      - ZVG Daten stündlich aktualisieren
      - ZVG Dossiers und Medien anreichern
    types: [completed]
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: zvgpro-mariadb-sync
  cancel-in-progress: false

jobs:
  sync:
    # workflow_run has access to secrets: accept only successful, trusted writers.
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            (
              github.event.workflow_run.event == 'schedule' ||
              github.event.workflow_run.event == 'workflow_dispatch'
            )
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Datensatz und Sync-Client aus demselben Commit laden
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/auctions.json
            /.github/scripts/sync-zvgpro-db.py
            /collector/publication_policy.py

      - name: Unveränderlichen Snapshot prüfen und bereitstellen
        shell: bash
        run: |
          python3 collector/publication_policy.py --check
          cp data/auctions.json auctions.json
          cp .github/scripts/sync-zvgpro-db.py sync-zvgpro-db.py
          test -s auctions.json
          test -s sync-zvgpro-db.py

      - name: PHP-Protokoll prüfen und MariaDB vollständig synchronisieren
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: python sync-zvgpro-db.py

