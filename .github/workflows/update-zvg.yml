name: ZVG Daten stündlich aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

# Readers, writers, diagnostics and migration share one lock. The storage API
# additionally enforces snapshot generations for writers outside Actions.
concurrency:
  group: zvg-data-writer
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.repository == 'danielfella-del/zvg-radar-data' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Nur Pipeline-Code laden
        uses: actions/checkout@v4
        with:
          # Resolve the reviewed main code only after the shared writer lock.
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /collector/
            /scripts/
            /tests/

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Offline-Verträge prüfen
        run: bash scripts/test-offline.sh

      - name: Privaten Laufzeitbestand verarbeiten
        env:
          PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/zvg-private-runtime
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        run: python .github/scripts/private-pipeline.py update

      - name: ZVGPro E-Mail-Alerts anstoßen
        continue-on-error: true
        env:
          ZVGPRO_ALERT_CRON_TOKEN: ${{ secrets.ZVGPRO_ALERT_CRON_TOKEN }}
        shell: bash
        run: |
          if [ -z "$ZVGPRO_ALERT_CRON_TOKEN" ]; then
            echo "Alert-Token fehlt; E-Mail-Alerts übersprungen."
            exit 0
          fi
          if ! curl --fail --silent --max-time 90 --output /dev/null -X POST \
            -H "Authorization: Bearer $ZVGPRO_ALERT_CRON_TOKEN" \
            https://zvgpro.de/api/alerts-run.php; then
            echo "::warning::Alert-Anfrage fehlgeschlagen; keine Antwortdaten protokolliert."
            exit 1
          fi

      - name: Temporäre Laufzeitdaten entfernen
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zvg-private-runtime'
          if path.is_symlink():
              path.unlink()
          elif path.exists():
              shutil.rmtree(path)
          PY
