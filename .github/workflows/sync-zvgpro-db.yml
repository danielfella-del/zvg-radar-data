name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      published_sha:
        description: Commit successfully published by the trusted producer.
        required: true
        type: string
    secrets:
      ZVGPRO_DB_SYNC_TOKEN:
        required: true
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  sync:
    # A reusable workflow inherits its caller's event and ref.
    if: >-
      ${{
        github.repository == 'danielfella-del/zvg-radar-data' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      }}
    concurrency:
      group: zvgpro-mariadb-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Aufrufer-Snapshot prüfen
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        shell: bash
        run: |
          if [[ -n "$PUBLISHED_SHA" && ! "$PUBLISHED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Ungültiger Aufrufer-Commit; kein DB-Sync."
            exit 1
          fi

      - name: Aktuellen Main-Snapshot nach Erwerb der Sync-Sperre laden
        uses: actions/checkout@v4
        with:
          # Resolve main only now: a queued caller must never roll back newer data.
          # Data, publication policy and sync client all come from this one checkout.
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/auctions.json
            /.github/scripts/sync-zvgpro-db.py
            /collector/publication_policy.py

      - name: Unveränderlichen Snapshot prüfen und bereitstellen
        env:
          PUBLISHED_SHA: ${{ inputs.published_sha }}
        shell: bash
        run: |
          snapshot_sha="$(git rev-parse HEAD)"
          if [[ ! "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Ungültiger Main-Snapshot; kein DB-Sync."
            exit 1
          fi
          printf 'DB-Sync Snapshot: %s\n' "$snapshot_sha"
          if [[ -n "$PUBLISHED_SHA" && "$PUBLISHED_SHA" != "$snapshot_sha" ]]; then
            printf 'Aufrufer-Snapshot %s wurde durch aktuellen Main %s überholt.\n' "$PUBLISHED_SHA" "$snapshot_sha"
          fi
          python3 collector/publication_policy.py --check
          cp data/auctions.json auctions.json
          cp .github/scripts/sync-zvgpro-db.py sync-zvgpro-db.py
          test -s auctions.json
          test -s sync-zvgpro-db.py

      - name: PHP-Protokoll prüfen und MariaDB vollständig synchronisieren
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: python sync-zvgpro-db.py
