name: ZVGPro MariaDB synchronisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: zvgpro-mariadb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Datensatz und Sync-Client aus demselben Commit laden
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/data/auctions.json" \
            -o auctions.json
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/scripts/sync-zvgpro-db.py" \
            -o sync-zvgpro-db.py
          test -s auctions.json
          test -s sync-zvgpro-db.py

      - name: PHP-Protokoll prüfen und MariaDB vollständig synchronisieren
        env:
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        shell: bash
        run: python sync-zvgpro-db.py

