name: ZVG Dossier Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

# Readers, writers, diagnostics and migration share one lock. The storage API
# additionally enforces snapshot generations for writers outside Actions.
concurrency:
  group: zvg-data-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.repository == 'danielfella-del/zvg-radar-data' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nur Pipeline-Code laden
        uses: actions/checkout@v4
        with:
          # Resolve the reviewed main code only after the shared writer lock.
          ref: main
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /collector/
            /scripts/
            /tests/

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install --disable-pip-version-check -r collector/requirements.txt
      - name: Private Speicherung prüfen; nur technische Metadaten
        env:
          PRIVATE_RUNTIME_ROOT: ${{ runner.temp }}/zvg-private-runtime
          ZVGPRO_DB_SYNC_TOKEN: ${{ secrets.ZVGPRO_DB_SYNC_TOKEN }}
        run: python .github/scripts/private-pipeline.py diagnose-zvg

      - name: Temporäre Laufzeitdaten entfernen
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'zvg-private-runtime'
          if path.is_symlink():
              path.unlink()
          elif path.exists():
              shutil.rmtree(path)
          PY
