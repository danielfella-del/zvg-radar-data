name: ZVG Actions Heartbeat

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/heartbeat.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Marker schreiben
        shell: bash
        run: |
          mkdir -p diagnostics
          echo "actions-ok" > diagnostics/heartbeat.txt
          git config user.name "zvg-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/heartbeat.txt
          git commit -m "ZVG Actions Heartbeat"
          git push
